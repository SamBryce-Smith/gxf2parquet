# Smoke-test config: exercises the whole DAG on the ~5k-row test GTF shipped
# in tests/. A plumbing test (finishes in a minute or two), NOT a meaningful
# performance benchmark.

annotations_yaml: config/annotations.yaml
annotations: [test_gencode]

data_dir: data
stage_dir: stage-smoke
results_dir: results-smoke

replicates: 1
cache_mode: warm

builds:
  single_zstd:
    partition_cols: []
    compression: zstd
  part_chrom_feature:
    partition_cols: [Chromosome, Feature]
    compression: zstd

query_builds: [single_zstd, part_chrom_feature]
naive_input: gtf

queries:
  full: [all]
  chrom: [chr1]
  columns: [gene_basic]
  gene_set: [10, 50]

column_sets:
  gene_basic: [gene_id, gene_name, gene_type]

gene_set_seed: 42
