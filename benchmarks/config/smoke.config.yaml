# Smoke-test config: exercises the whole DAG on the ~5k-row test GTF shipped
# in tests/ and on a 100x scaled copy of it (~500k rows, built locally, no
# download). The 5k-row cells are a plumbing test dominated by Python
# start-up; the scaled cells are large enough to compare code versions
# (see compare.sh). Neither replaces a real full-annotation run.

annotations_yaml: config/annotations.yaml
annotations: [test_gencode, test_gencode_x100]

data_dir: data
stage_dir: stage-smoke
results_dir: results-smoke

replicates: 3
cache_mode: warm

builds:
  single_zstd:
    partition_cols: []
    compression: zstd
  part_chrom_feature:
    partition_cols: [Chromosome, Feature]
    compression: zstd

query_builds: [single_zstd, part_chrom_feature]
naive_input: gtf

queries:
  full: [all]
  chrom: [chr1]
  columns: [gene_basic]
  gene_set: [10, 1000]

column_sets:
  gene_basic: [gene_id, gene_name, gene_type]

gene_set_seed: 42

# Import gxf2parquet from this source tree instead of the installed copy
# (empty = installed). compare.sh sets it per side.
gxf2parquet_src: ""
