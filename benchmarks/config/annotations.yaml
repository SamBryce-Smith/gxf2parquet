# Annotation sources. Each entry is keyed by the name used in a pipeline
# config's `annotations:` list and by `pixi run download <name>`.
#
# Each entry sets one of:
#   url         downloaded into data/<name>/ by workflow/scripts/download_annotation.py
#   path        a local file, relative to the benchmarks/ directory
#   scale_from  another entry, repeated `copies` times (built by the pipeline)
#
# Checksums: a download is accepted only if its md5 matches. The expected
# value is `md5` when pinned; otherwise it is looked up by file name in
# `md5sums_url` (GENCODE publishes an MD5SUMS file per release). After the
# first verified download, pin the value printed by the script (also written
# to data/<name>/<file>.md5) so later runs don't depend on MD5SUMS.

gencode_v50:
  # GENCODE Release 50 (GRCh38.p14), comprehensive annotation on the
  # reference chromosomes.
  url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.annotation.gtf.gz
  md5sums_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/MD5SUMS
  md5: ""
  preset: gencode

# Small GENCODE subset shipped with the test suite (chr1 only, ~5k rows).
# Used by config/smoke.config.yaml: no download required.
test_gencode:
  path: ../tests/pyranges_data.gencode.gtf.gz
  md5: ""
  preset: gencode

# Derived: the test GTF above repeated 100x under renamed chromosomes and IDs
# (~500k rows, 100 "chromosomes"), built by workflow/scripts/make_scaled_gtf.py.
# Large enough that memory and runtime differences show above Python start-up,
# with no download. A `chrom: chr1` query selects 1/100 of it.
test_gencode_x100:
  scale_from: test_gencode
  copies: 100
  preset: gencode
