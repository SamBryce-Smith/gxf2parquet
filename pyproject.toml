[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gff2parquet"
version = "0.1.0"
description = "Convert GTF annotation files to Parquet format for efficient genomics workflows"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Sam" }
]
dependencies = [
    "pyranges1>=1.2.0",
    "pandas<3.0.0",
    "pyarrow>=14.0.0",
]

[project.scripts]
gtf-to-parquet = "gff2parquet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gff2parquet"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
]

[dependency-groups]
dev = [
    "prek>=0.3.2",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
