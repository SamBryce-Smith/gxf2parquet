[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gxf2parquet"
version = "0.1.0"
description = "Convert GTF annotation files to Parquet format for efficient genomics workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Sam Bryce-Smith" }
]
keywords = ["gtf", "gff", "parquet", "genomics", "bioinformatics", "pyranges"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pyranges1>=1.3.5",
    "pandas",
    "pyarrow>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/SamBryce-Smith/gxf2parquet"
Repository = "https://github.com/SamBryce-Smith/gxf2parquet"
Issues = "https://github.com/SamBryce-Smith/gxf2parquet/issues"

[project.scripts]
gxf2parquet = "gxf2parquet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gxf2parquet"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/benchmarks",
]

[dependency-groups]
dev = [
    "prek>=0.3.2",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
